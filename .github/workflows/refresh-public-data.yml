name: Refresh public GitHub data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-public-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: standalone-portfolio
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run refresh:github
      - run: npm run build
      - id: diff
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          branch="automation/public-data-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/github.json assets/app.bundle.js index.html work research publications about zh
          git commit -m "chore(data): refresh public GitHub metrics"
          git push --set-upstream origin "$branch"
          gh pr create --base standalone-portfolio --head "$branch" --title "chore(data): refresh public GitHub metrics" --body "Automated daily snapshot refresh. This PR does not deploy the site; review and merge separately."
